<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>precss 浏览器运行时</title>
<!-- 三个 style[lang] 模块：scss / less / sass，交给 MoonBit 编译后应用 -->
<style lang="scss">
$c: blue;
.card { color: $c; .title { font-weight: bold; } }
</style>
<style lang="less">
@c: green;
.banner { color: @c; width: 10px * 2; }
</style>
<style lang="sass">
$c: red
.btn
  color: $c
  a
    margin: 4px 8px
</style>
</head>
<body>
<h1>precss 浏览器运行时</h1>
<p>打开控制台应看到「compiled 3 style module(s)」；三个模块的样式在 DOMContentLoaded 后被 MoonBit 编译并替换为普通 CSS。</p>
<div class="card">SCSS：变量 + 嵌套</div>
<div class="banner">LESS：@var + 乘法</div>
<div class="btn">SASS：缩进语法</div>
<script type="module" src="./runtime.js"></script>
</body>
</html>
