# GitHub Pages 部署：构建 precss 演示站（rabbita SSG + webruntime web.js）
# 产物 = site/out（index.html + site.css + tailwind.css + demo.js + codemirror/ + web.js）
# 触发：push 到 main / 手动触发
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 更新根项目依赖
        run: moon update

      - name: 安装 Node 依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 precss native CLI
        run: |
          MOON_CC=clang MOON_AR=ar MOON_LD=clang moon build --target native cmd/cli

      - name: 运行性能基准并生成 JSON
        run: |
          pnpm run bench:release | tee benchmark.log
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'
          const data = JSON.parse(readFileSync('site/static/data/benchmark.json', 'utf8'))
          const invalid = data.results.filter((r) => !r.correctness.included)
          if (invalid.length > 0) {
            console.error(`性能基准正确性校验失败：${invalid.map((r) => r.syntax).join(', ')}`)
            process.exitCode = 1
          }
          const rows = data.results.map((r) => {
            const ok = r.correctness.included ? '✅' : '❌'
            return `| ${r.syntax.toUpperCase()} | ${r.precss_native_cli.median_ms} ms | ${r.baseline.stats.median_ms} ms | ${r.speedup_x ?? '-'}x | ${ok} ${r.correctness.matched}/${r.correctness.total} |`
          })
          const summary = [
            '## precss 性能基准',
            '',
            `Profile：${data.profile}；数据集：${data.dataset.name}；${data.dataset.count} 份输入；总输入 ${data.dataset.actual_input_bytes.scss} bytes；深度 ${data.dataset.depth}；${data.dataset.iterations} 次采样`,
            '',
            '| 格式 | precss native | 对比实现 | 加速比 | 正确性 |',
            '|---|---:|---:|---:|---:|',
            ...rows,
            '',
            `提交：${data.commit}`,
          ].join('\\n')
          process.stdout.write(summary)
          EOF
          node --input-type=module <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs'
          const data = JSON.parse(readFileSync('site/static/data/benchmark.json', 'utf8'))
          const rows = data.results.map((r) => `| ${r.syntax.toUpperCase()} | ${r.precss_native_cli.median_ms} ms | ${r.baseline.stats.median_ms} ms | ${r.speedup_x ?? '-'}x | ${r.correctness.matched}/${r.correctness.total} |`)
          process.stdout.write(['## precss 性能基准', '', `Profile：${data.profile}；数据集：${data.dataset.name}；${data.dataset.count} 份输入；总输入 ${data.dataset.actual_input_bytes.scss} bytes；深度 ${data.dataset.depth}；${data.dataset.iterations} 次采样`, '', '| 格式 | precss native | 对比实现 | 加速比 | 正确性 |', '|---|---:|---:|---:|---:|', ...rows, '', `提交：${data.commit}`].join('\\n'))
          EOF

      - name: 运行测试并生成 JSON
        run: |
          pnpm run test:report | tee tests.log
          node --input-type=module <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs'
          const data = JSON.parse(readFileSync('site/static/data/tests.json', 'utf8'))
          const rows = data.suites.map((suite) => `| ${suite.name} | ${suite.passed}/${suite.total} | ${suite.failed} | ${suite.status === 'passed' ? '✅' : '❌'} |`)
          process.stdout.write(['## precss 测试验证', '', '| 测试套件 | 通过 | 失败 | 状态 |', '|---|---:|---:|---:|', ...rows, '', `总计：${data.passed}/${data.total}，失败：${data.failed}`, `提交：${data.commit}`].join('\\n'))
          EOF

      # 构建演示站（rabbita SSG）→ site/out（index.html + css + demo.js + codemirror/）
      - name: 构建演示站（SSG）
        working-directory: site
        run: |
          moon update
          MOON_CC=clang MOON_AR=ar MOON_LD=clang moon run cmd/ssg --target native

      # webruntime 的 JS backend 产物（demo.js 的 import './web.js' 依赖它；wasm 加载失败时回退用）
      - name: 构建并复制 webruntime web.js
        run: |
          MOON_CC=clang MOON_AR=ar MOON_LD=clang moon build --target js example/webruntime/web
          cp _build/js/debug/build/example/webruntime/web/web.js site/out/web.js

      # webruntime 的 wasm-gc 产物（demo.js 优先加载 web.wasm 作为编译引擎）
      - name: 构建并复制 webruntime wasm-gc
        run: |
          MOON_CC=clang MOON_AR=ar MOON_LD=clang moon build --target wasm-gc example/webruntime/wasm
          cp _build/wasm-gc/debug/build/example/webruntime/wasm/wasm.wasm site/out/web.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
