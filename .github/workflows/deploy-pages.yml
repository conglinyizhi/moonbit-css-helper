# GitHub Pages 部署：构建 precss 演示站（rabbita SSG + webruntime web.js）
# 产物 = site/out（index.html + site.css + tailwind.css + demo.js + codemirror/ + web.js）
# 触发：push 到 main / 手动触发
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 更新根项目依赖
        run: moon update

      # 构建演示站（rabbita SSG）→ site/out（index.html + css + demo.js + codemirror/）
      - name: 构建演示站（SSG）
        working-directory: site
        run: |
          moon update
          MOON_CC=clang MOON_AR=ar MOON_LD=clang moon run cmd/ssg --target native

      # webruntime 的 JS backend 产物（demo.js 的 import './web.js' 依赖它）
      - name: 构建并复制 webruntime web.js
        run: |
          MOON_CC=clang MOON_AR=ar MOON_LD=clang moon build --target js example/webruntime/web
          cp _build/js/debug/build/example/webruntime/web/web.js site/out/web.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
